[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grandgousier"
version = "0.7.0.9"
description = "Astronomical archive photometry and calibration engine"
readme = "README_PUBLIC.md"
requires-python = ">=3.11"
authors = [{name = "Nikita Chazov"}]
dependencies = [
    "astropy>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "certifi>=2024.2.2",
    "requests>=2.31",
]

[project.optional-dependencies]
photometry = [
    "photutils>=1.12",
    "ccdproc>=2.4",
    "astroscrappy>=1.2",
    "sep>=1.2",
    "astroquery>=0.4.7",
    "requests>=2.31",
]
gaia = [
    "astroquery>=0.4.7",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
release = [
    "build>=1.2,<2",
    "wheel>=0.44,<1",
    "packaging>=23.2,<27",
]

[project.scripts]
grandgousier = "grandgousier.cli:main"

[tool.setuptools.packages.find]
include = ["grandgousier*"]

[tool.setuptools.package-data]
"grandgousier.resources" = ["configs/*.yaml", "migrations/*.sql", "acceptance/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
